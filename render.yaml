databases:
  - name: expedientes-db
    plan: free
services:
  - type: web
    name: gestion-expedientes-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase: {name: expedientes-db, property: connectionString}
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
